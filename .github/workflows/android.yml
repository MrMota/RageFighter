name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-latest runner ships with the Android SDK preinstalled (ANDROID_HOME).
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      # Caches the Gradle distribution and dependencies between runs,
      # so builds don't depend on downloading Gradle every time.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate and patch the Android project
        run: |
          npx cap add android
          ./scripts/patch-android.sh
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        # Retry: the Gradle download occasionally hits transient server errors (e.g. 504).
        run: |
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in $((i * 15))s..."; sleep $((i * 15))
          done
          exit 1

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RageFighter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RageFighter-apk
          path: RageFighter.apk
