name: Release signed APK

# Push a tag like v1.0.0 to publish a signed APK on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Diagnostics only: lengths and character checks, never the values.
          CLEAN=$(printf '%s' "$KS" | tr -d ' \r\n\t')
          echo "ANDROID_KEYSTORE_BASE64: ${#KS} chars as stored, ${#CLEAN} after removing whitespace (expected 5720)"
          BAD=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
          echo "ANDROID_KEYSTORE_BASE64: $BAD characters that are not valid base64 (expected 0)"
          echo "ANDROID_KEYSTORE_PASSWORD: ${#PW} chars (expected 24)"
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate and patch the Android project
        run: |
          npx cap add android
          ./scripts/patch-android.sh
          npx cap sync android
          VERSION="${TAG#v}"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          for i in 1 2 3 4; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in $((i * 15))s..."; sleep $((i * 15))
          done
          exit 1

      - name: Sign APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Strip any spaces/line breaks picked up when pasting the secret.
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-paste the full single line from signing-secrets.txt."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias ragefighter >/dev/null || {
            echo "::error::Keystore could not be opened. Check ANDROID_KEYSTORE_PASSWORD and that ANDROID_KEYSTORE_BASE64 was copied completely."; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias ragefighter \
            --ks-pass env:PW --key-pass env:PW --out "RageFighter-$TAG.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "RageFighter-$TAG.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: RageFighter ${{ env.TAG }}
          files: RageFighter-${{ env.TAG }}.apk
          generate_release_notes: true
          body: |
            ## Install on Android
            1. Download **RageFighter-${{ env.TAG }}.apk** below.
            2. Open it on your phone. If asked, allow installing apps from this source.
            3. Tap **Install** and play.

            Prefer the browser? Play the web version at https://mrmota.github.io/RageFighter/
