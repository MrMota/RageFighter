<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120c24">
<meta name="description" content="RageFighter: an original 2D arcade fighting game. Play offline, on desktop or mobile.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RageFighter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<button id="pauseBtn" aria-label="Pause">II</button>
<div id="touch" aria-hidden="true">
  <div id="stick"><div id="knob"></div></div>
  <div id="buttons">
    <div class="btn lp" data-btn="lp">LP</div>
    <div class="btn hp" data-btn="hp">HP</div>
    <div class="btn lk" data-btn="lk">LK</div>
    <div class="btn hk" data-btn="hk">HK</div>
    <div class="btn rage" data-btn="rage">RAGE</div>
  </div>
</div>
<div id="rotate">Rotate your device to landscape ↻</div>
<script type="module" src="js/game.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
